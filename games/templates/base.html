<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}GameHub{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0f172a;
            --surface: #1e293b;
            --surface-hover: #334155;
            --border: #334155;
            --text: #f8fafc;
            --text-muted: #94a3b8;
            --primary: #6366f1;
            --primary-glow: rgba(99, 102, 241, 0.25);
            --accent: #38bdf8;
            --success: #10b981;
            --warning: #f59e0b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 24px 20px;
            width: 100%;
        }

        header {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 50;
        }

        .nav-wrapper {
            display: flex;
            align-items: center;
            justify-content: space-between;
            max-width: 900px;
            margin: 0 auto;
            padding: 16px 20px;
        }

        .logo {
            font-size: 1.25rem;
            font-weight: 700;
            color: #fff;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 8px;
            background: linear-gradient(135deg, #818cf8, #38bdf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        nav {
            display: flex;
            gap: 12px;
        }

        nav a {
            text-decoration: none;
            color: var(--text-muted);
            font-weight: 500;
            font-size: 0.95rem;
            padding: 8px 14px;
            border-radius: 8px;
            transition: all 0.2s ease;
        }

        nav a:hover {
            color: #fff;
            background-color: var(--surface-hover);
        }

        h1 {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 24px;
            color: #fff;
            letter-spacing: -0.02em;
        }

        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 16px;
            transition: transform 0.15s ease, border-color 0.15s ease, box-shadow 0.15s ease;
        }

        .card-interactive:hover {
            transform: translateY(-2px);
            border-color: #475569;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.4);
        }

        .card a.title-link {
            text-decoration: none;
            color: #fff;
            font-size: 1.2rem;
            font-weight: 600;
            display: inline-block;
            transition: color 0.15s ease;
        }

        .card a.title-link:hover {
            color: var(--accent);
        }

        .badge-platform {
            display: inline-block;
            background: rgba(56, 189, 248, 0.12);
            color: var(--accent);
            border: 1px solid rgba(56, 189, 248, 0.25);
            font-size: 0.78rem;
            font-weight: 600;
            padding: 4px 10px;
            border-radius: 9999px;
            margin-right: 6px;
            margin-top: 6px;
        }

        .badge-status {
            display: inline-block;
            font-size: 0.75rem;
            font-weight: 600;
            padding: 3px 8px;
            border-radius: 6px;
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }

        .status-planned { background: rgba(148, 163, 184, 0.2); color: #cbd5e1; }
        .status-playing { background: rgba(99, 102, 241, 0.25); color: #a5b4fc; }
        .status-completed { background: rgba(16, 185, 129, 0.2); color: #6ee7b7; }
        .status-abandoned { background: rgba(239, 68, 68, 0.2); color: #fca5a5; }

        .rating-badge {
            background: linear-gradient(135deg, #10b981, #059669);
            color: white;
            font-weight: 700;
            font-size: 0.85rem;
            padding: 3px 8px;
            border-radius: 6px;
        }

        .empty-box {
            background: var(--surface);
            border: 1px dashed var(--border);
            padding: 36px;
            border-radius: 12px;
            text-align: center;
            color: var(--text-muted);
        }

        .counter-footer {
            margin-top: 24px;
            color: var(--text-muted);
            font-size: 0.9rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 18px;
            border-radius: 8px;
            background: var(--surface);
            color: var(--text);
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 500;
            border: 1px solid var(--border);
            transition: all 0.2s ease;
        }

        .btn:hover {
            background: var(--surface-hover);
            color: #fff;
        }
    </style>
</head>
<body>
    <header>
        <div class="nav-wrapper">
            <a href="{% url 'game_list' %}" class="logo">⚡ GameHub</a>
            <nav>
                <a href="{% url 'game_list' %}">🎮 Ігри</a>
                <a href="{% url 'platform_list' %}">💻 Платформи</a>
            </nav>
        </div>
    </header>

    <main class="container">
        {% block content %}{% endblock %}
    </main>
</body>
</html>
