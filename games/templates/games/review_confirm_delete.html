{% extends 'base.html' %}

{% block title %}Видалити відгук — GameHub{% endblock %}

{% block content %}
    <div style="max-width: 520px; margin: 40px auto;">
        <div class="card" style="border-color: rgba(239, 68, 68, 0.4); padding: 28px;">
            <h1 style="font-size: 1.5rem; color: #fca5a5; margin-bottom: 12px;">Видалити відгук?</h1>
            <p style="color: var(--text-muted); margin-bottom: 20px;">
                Ви впевнені, що хочете видалити свій відгук (Оцінка: <strong style="color: #fff;">{{ object.rating }}/10</strong>) до гри <strong style="color: #fff;">«{{ object.game.name }}»</strong>?
            </p>

            <form method="post">
                {% csrf_token %}
                <div style="display: flex; gap: 12px;">
                    <button type="submit" class="btn btn-danger" style="padding: 10px 18px;">Так, видалити</button>
                    <a href="{% url 'game_detail' object.game.pk %}" class="btn">Скасувати</a>
                </div>
            </form>
        </div>
    </div>
{% endblock %}
