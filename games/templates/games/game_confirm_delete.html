{% extends 'base.html' %}

{% block title %}Видалити гру — GameHub{% endblock %}

{% block content %}
    <div style="max-width: 540px; margin: 40px auto;">
        <div class="card" style="border-color: rgba(239, 68, 68, 0.4); box-shadow: 0 0 20px rgba(239, 68, 68, 0.15); padding: 28px;">
            <h1 style="font-size: 1.5rem; color: #fca5a5; margin-bottom: 12px;">Видалити гру?</h1>
            <p style="color: var(--text-muted); margin-bottom: 20px;">
                Ви впевнені, що хочете остаточно видалити гру <strong style="color: #fff;">«{{ object.name }}»</strong>?
                Разом із нею будуть видалені всі пов'язані відгуки.
            </p>

            <form method="post">
                {% csrf_token %}
                <div style="display: flex; gap: 12px;">
                    <button type="submit" class="btn btn-danger" style="padding: 10px 18px;">Так, видалити</button>
                    <a href="{% url 'game_detail' object.pk %}" class="btn">Скасувати</a>
                </div>
            </form>
        </div>
    </div>
{% endblock %}
